events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # SSL settings
    server {
        listen 443 ssl;
        server_name itlportaldev.claimpay.net;

        ssl_certificate /etc/nginx/ssl/claimpay.net.crt;
        ssl_certificate_key /etc/nginx/ssl/claimpay.net.key;

        # Route requests to the backend
        location /api/ {
            proxy_pass http://clients-portal-backend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve frontend files for all other routes
        location / {
            proxy_pass http://clients-portal-frontend:4173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
